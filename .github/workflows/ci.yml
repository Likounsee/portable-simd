name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Keep CI focused on the newest commit for each branch. Older queued or
# running runs are superseded so a burst of direct commits cannot starve the
# latest validation behind dozens of obsolete matrix runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  PROPTEST_CASES: 64
  # Pin the host-side Cross executable independently of the emulated target matrix.
  CROSS_REV: 4090beca3cfffa44371a5bba524de3a578aa46c3

jobs:
  quality-checks:
    name: "formatting and masked-memory checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Compile AVX-512 swizzle implementations without executing them
        run: cargo check -p core_simd --lib
        env:
          RUSTFLAGS: -C target-feature=+avx2,+avx512f,+avx512bw,+avx512vl,+avx512vbmi
      - name: Check standalone benchmark formatting
        run: rustfmt --edition 2024 --check benchmarks/masked_load_store.rs benchmarks/gather_unchecked.rs
      - name: Build and inspect benchmarks through Cargo
        run: |
          # Compile the diagnostic programs as binaries in an external Cargo
          # package. Cargo then links core_simd as a normal dependency, avoiding
          # the metadata-only rlib produced when this crate is built standalone.
          mkdir -p /tmp/core-simd-benchmark/src/bin
          cp "$GITHUB_WORKSPACE/benchmarks/masked_load_store.rs" /tmp/core-simd-benchmark/src/bin/masked_load_store.rs
          cp "$GITHUB_WORKSPACE/benchmarks/gather_unchecked.rs" /tmp/core-simd-benchmark/src/bin/gather_unchecked.rs
          cat > /tmp/core-simd-benchmark/Cargo.toml <<TOML
          [package]
          name = "core-simd-benchmark"
          version = "0.0.0"
          edition = "2024"

          [workspace]

          [dependencies]
          core_simd = { path = "${GITHUB_WORKSPACE}/crates/core_simd", features = ["as_crate"] }
          TOML
          TARGET_DIR="$RUNNER_TEMP/core-simd-benchmark-target"

          cargo rustc --manifest-path /tmp/core-simd-benchmark/Cargo.toml --target-dir "$TARGET_DIR" --release --bin masked_load_store -- -C target-cpu=x86-64 -C target-feature=+sse2 --emit=link,asm=/tmp/masked-load-store.s,llvm-ir=/tmp/masked-load-store.ll
          cargo rustc --manifest-path /tmp/core-simd-benchmark/Cargo.toml --target-dir "$TARGET_DIR" --release --bin gather_unchecked -- -C target-cpu=x86-64 -C target-feature=+sse2 --emit=link,asm=/tmp/gather-unchecked.s,llvm-ir=/tmp/gather-unchecked.ll

          "$TARGET_DIR/release/masked_load_store"
          "$TARGET_DIR/release/gather_unchecked"

          AVX2_TARGET_DIR="$RUNNER_TEMP/core-simd-benchmark-avx2-target"
          cargo rustc --manifest-path /tmp/core-simd-benchmark/Cargo.toml --target-dir "$AVX2_TARGET_DIR" --release --bin gather_unchecked -- -C target-cpu=x86-64 -C target-feature=+avx2 --emit=link,asm=/tmp/gather-unchecked-avx2.s,llvm-ir=/tmp/gather-unchecked-avx2.ll
          "$AVX2_TARGET_DIR/release/gather_unchecked"

      - name: Upload masked-memory codegen diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: masked-load-store-codegen-${{ github.sha }}
          path: |
            /tmp/masked-load-store.s
            /tmp/masked-load-store.ll
            /tmp/gather-unchecked.s
            /tmp/gather-unchecked.ll
            /tmp/gather-unchecked-avx2.s
            /tmp/gather-unchecked-avx2.ll
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: "documentation (warnings denied)"
    # Main pushes use the separately permission-scoped deployment job below.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Build documentation
        run: cargo +nightly doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  deploy-docs:
    name: "build and deploy documentation"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Scoped to the trusted main-branch deployment job only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-deploy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-deploy-
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Build documentation
        run: cargo +nightly doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./target/doc

  clippy:
    name: "clippy on ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # We shouldn't really have any OS-specific code, so think of this as a list of architectures
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - i586-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - arm64ec-pc-windows-msvc
          - armv7-unknown-linux-gnueabihf
          - loongarch64-unknown-linux-gnu
          # non-nightly since https://github.com/rust-lang/rust/pull/113274
          # - mips-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - sparc64-unknown-linux-gnu
          - wasm32-unknown-unknown

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-${{ matrix.target }}-
      - name: Setup Rust
        run: rustup target add ${TARGET}
        env:
          TARGET: ${{ matrix.target }}
      - name: Run Clippy
        run: cargo clippy --all-targets --target ${TARGET} -- -D clippy::needless_range_loop
        env:
          TARGET: ${{ matrix.target }}

  x86-tests:
    name: "${{ matrix.target_feature }} on ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu, i686-pc-windows-msvc, x86_64-unknown-linux-gnu]
        # `default` means the default target config, `native` uses -Ctarget-cpu=native,
        # and the remaining entries are passed to -Ctarget-feature.
        target_feature: [default, native, +sse3, +ssse3, +sse4.1, +sse4.2, +avx, +avx2]
        exclude:
          # -Ctarget-cpu=native is not meaningful for a cross-target build.
          - { target: i686-pc-windows-msvc, target_feature: native }
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-pc-windows-gnu, os: windows-latest }
          - { target: i686-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Native artifacts depend on the physical runner CPU. Do not restore a
      # target directory compiled with a different runner's -Ctarget-cpu=native.
      - name: Cache Cargo dependencies and build artifacts
        if: matrix.target_feature != 'native'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x86-${{ matrix.target }}-${{ matrix.target_feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86-${{ matrix.target }}-${{ matrix.target_feature }}-

      # Keep downloaded crates warm, but compile native-feature artifacts fresh
      # on every runner so AVX/AVX-512 capabilities cannot leak across hosts.
      - name: Cache Cargo dependencies for native CPU tests
        if: matrix.target_feature == 'native'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-x86-native-deps-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86-native-deps-${{ matrix.target }}-
      - name: Setup Rust
        run: rustup target add ${TARGET}
        env:
          TARGET: ${{ matrix.target }}

      - name: Configure RUSTFLAGS
        shell: bash
        run: |
          case "${TARGET_FEATURE}" in
            default)
              echo "RUSTFLAGS=-Dwarnings" >> $GITHUB_ENV;;
            native)
              echo "RUSTFLAGS=-Dwarnings -Ctarget-cpu=native" >> $GITHUB_ENV
              ;;
            *)
              echo "RUSTFLAGS=-Dwarnings -Ctarget-feature=${TARGET_FEATURE}" >> $GITHUB_ENV
              ;;
          esac
        env:
          TARGET_FEATURE: ${{ matrix.target_feature }}

      # Super useful for debugging why a SIGILL occurred.
      - name: Dump target configuration and support
        run: |
          rustc -Vv

          echo "Caveat: not all target features are expected to be logged"

          echo "## Requested target configuration (RUSTFLAGS=$RUSTFLAGS)"
          rustc --print=cfg --target=${TARGET} $RUSTFLAGS

          echo "## Supported target configuration for --target=${TARGET}"
          rustc --print=cfg --target=${TARGET} -Ctarget-cpu=native

          echo "## Natively supported target configuration"
          rustc --print=cfg -Ctarget-cpu=native
        env:
          TARGET: ${{ matrix.target }}

      - name: Test (debug)
        run: cargo test --verbose --target=${TARGET}
        env:
          TARGET: ${{ matrix.target }}

      - name: Test (release)
        run: cargo test --verbose --target=${TARGET} --release
        env:
          TARGET: ${{ matrix.target }}

  macos-tests:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-${{ matrix.target }}-
      - name: Setup Rust
        run: rustup target add ${TARGET}
        env:
          TARGET: ${{ matrix.target }}

      - name: Configure RUSTFLAGS
        shell: bash
        run: echo "RUSTFLAGS=-Dwarnings" >> $GITHUB_ENV

      - name: Test (debug)
        run: cargo test --verbose --target=${TARGET}
        env:
          TARGET: ${{ matrix.target }}

      - name: Test (release)
        run: cargo test --verbose --target=${TARGET} --release
        env:
          TARGET: ${{ matrix.target }}


  wasm-tests:
    name: "wasm (firefox, ${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: default, RUSTFLAGS: "" }
          - { name: simd128, RUSTFLAGS: "-C target-feature=+simd128" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ matrix.name }}-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test (debug)
        run: wasm-pack test --firefox --headless crates/core_simd
        env:
            RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Test (release)
        run: wasm-pack test --firefox --headless crates/core_simd --release
        env:
            RUSTFLAGS: ${{ matrix.rustflags }}

  # Build the host-side Cross tool once before fanning out the emulated targets.
  # This avoids eight concurrent cargo installs on a cold cache.
  cross-tool:
    name: "prepare Cross host tool"
    runs-on: ubuntu-latest
    steps:
      # Cross inspects the current Cargo workspace even for --version.
      # Check out the repository so its metadata probe has a valid manifest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cross executable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/bin/cross-util
          key: ${{ runner.os }}-cross-${{ env.CROSS_REV }}

      - name: Install Cross on cache miss
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install --locked cross --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
          fi

      - name: Add Cargo binaries to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify Cross
        run: cross --version

  cross-tests:
    name: "${{ matrix.target_feature }} on ${{ matrix.target }} (via cross)"
    needs: cross-tool
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 16
    strategy:
      fail-fast: false

      matrix:
        target:
          - armv7-unknown-linux-gnueabihf
          - thumbv7neon-unknown-linux-gnueabihf # includes neon by default
          - aarch64-unknown-linux-gnu           # includes neon by default
          - powerpc-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu       # includes altivec by default
          - riscv64gc-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          # MIPS uses a nonstandard binary representation for NaNs which makes it worth testing
          # non-nightly since https://github.com/rust-lang/rust/pull/113274
          # - mips-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          # Lots of errors in QEMU and no real hardware to test on. Not clear if it's QEMU or bad codegen.
          # - powerpc64-unknown-linux-gnu
        target_feature: [default]
        include:
          - { target: powerpc64le-unknown-linux-gnu, target_feature: "+vsx" }
          # Fails due to QEMU floating point errors, probably handling subnormals incorrectly.
          # This target is somewhat redundant, since ppc64le has altivec as well.
          # - { target: powerpc-unknown-linux-gnu, target_feature: "+altivec" }
          # We should test this, but cross currently can't run it
          # - { target: riscv64gc-unknown-linux-gnu, target_feature: "+v,+zvl128b" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restore the single Cross build prepared by the cross-tool job.
      - name: Restore Cross executable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/bin/cross-util
          key: ${{ runner.os }}-cross-${{ env.CROSS_REV }}

      - name: Cache Cargo dependencies and target artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ matrix.target }}-${{ matrix.target_feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-${{ matrix.target }}-${{ matrix.target_feature }}-
      - name: Setup Rust
        run: rustup target add ${TARGET}
        env:
          TARGET: ${{ matrix.target }}

      - name: Add restored Cargo binaries to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify restored Cross
        run: cross --version

      - name: Configure Emulated CPUs
        run: |
          echo "CARGO_TARGET_POWERPC_UNKNOWN_LINUX_GNU_RUNNER=qemu-ppc -cpu e600" >> $GITHUB_ENV
          # echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER=qemu-riscv64 -cpu rv64,zba=true,zbb=true,v=true,vlen=256,vext_spec=v1.0" >> $GITHUB_ENV

      - name: Configure RUSTFLAGS
        shell: bash
        run: |
          case "${TARGET_FEATURE}" in
            default)
              echo "RUSTFLAGS=" >> $GITHUB_ENV;;
            *)
              echo "RUSTFLAGS=-Ctarget-feature=${TARGET_FEATURE}" >> $GITHUB_ENV
              ;;
          esac
        env:
          TARGET_FEATURE: ${{ matrix.target_feature }}

      - name: Test (debug)
        run: cross test --verbose --target=${TARGET}
        env:
          TARGET: ${{ matrix.target }}

      - name: Test (release)
        run: cross test --verbose --target=${TARGET} --release
        env:
          TARGET: ${{ matrix.target }}

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PROPTEST_CASES: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-miri-${{ matrix.shard }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-${{ matrix.shard }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      - name: Test (Miri) (partition ${{ matrix.shard }}/4)
        run: |
          cargo miri nextest run --partition count:${SHARD}/4
        env:
          SHARD: ${{ matrix.shard }}
